<!-- @dsCard height=288 -->
<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>gutoexplorer</title>
<style>
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--sky-top);
    color: var(--text);
    font-family: var(--font-sans);
    overflow: hidden;
  }
  .cover { position: relative; height: 288px; overflow: hidden; }
  .art { position: absolute; top: 0; bottom: 0; left: 480px; width: 480px; overflow: hidden; }
  .art svg { display: block; width: 480px; height: 288px; }

  /* every fill, stroke and corner is a token */
  .brand { fill: var(--celeste); }
  .action { fill: var(--accent); }
  .soft { fill: var(--accent-soft); }
  .light { fill: var(--celeste-strong); }
  .deep { fill: var(--celeste-deep); }
  .blk { rx: var(--radius-card); }
  .cut { fill: none; stroke: var(--sky-top); stroke-width: 1.25; }
  .cut--dash { stroke-dasharray: 3 5; }

  .words { position: absolute; left: 56px; bottom: 36px; max-width: 440px; }
  .name {
    margin: 0;
    font-family: var(--font-display);
    font-size: 52px;
    line-height: 0.95;
    font-weight: 600;
    letter-spacing: -0.03em;
    color: var(--text);
    white-space: nowrap;
  }
  .tag {
    margin: 10px 0 0 2px;
    font-size: 13px;
    line-height: 18px;
    color: var(--text-muted);
  }
</style>
</head>
<body>
  <div class="cover">
    <div class="art" aria-hidden="true">
      <svg viewBox="0 0 480 288" width="480" height="288" focusable="false">
        <!--
          blocks      celeste 196x232 (marca) · accent 112x150 (ação) · accent-soft 112x66 · celeste-strong 128x84 · celeste-deep 128x64 — 32% da capa, à direita de x=480
          arrangement pilha escalonada: slab alto à esquerda, satélites de duas colunas à direita, o bloco claro sangrando na borda; gutters de 16 (space-6)
          pattern     anéis orbitais (o anel do logo) recortados do slab em sky-top: elipse rx 150 / ry 46 a -18°, círculos r 96 e r 60
          scales      margem 28, gutter 16, cantos radius-card (12); nome em display-cover (52px) e tagline em small (13px)
        -->
        <defs>
          <clipPath id="gb-slab">
            <rect class="blk" x="12" y="28" width="196" height="232"/>
          </clipPath>
        </defs>

        <rect class="brand blk" x="12" y="28" width="196" height="232"/>
        <rect class="action blk" x="224" y="28" width="112" height="150"/>
        <rect class="soft blk" x="224" y="194" width="112" height="66"/>
        <rect class="light blk" x="352" y="28" width="128" height="84"/>
        <rect class="deep blk" x="352" y="128" width="128" height="64"/>

        <g clip-path="url(#gb-slab)">
          <ellipse class="cut" cx="110" cy="144" rx="150" ry="46" transform="rotate(-18 110 144)"/>
          <circle class="cut cut--dash" cx="110" cy="144" r="96"/>
          <circle class="cut" cx="110" cy="144" r="60"/>
        </g>
      </svg>
    </div>

    <div class="words">
      <h1 class="name display-cover">gutoexplorer</h1>
      <p class="tag">Dados, processos e decisões.</p>
    </div>
  </div>
</body>
</html>
